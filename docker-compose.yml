services:
  job-research:
    build: .
    env_file:
      - .env
    environment:
      RESUME_PATH: /app/resume.pdf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - job-data:/app/data
      - ./inputs:/app/inputs:ro
      - ./config:/app/config:ro
      - type: bind
        source: ${RESUME_FILE:-./resume.pdf}
        target: /app/resume.pdf
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 45s

volumes:
  job-data:
